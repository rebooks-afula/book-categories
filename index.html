<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מאתר קטגוריות ספרים</title>
    <style>
        :root {
            --primary: #2c3e50;
            --accent: #3498db;
            --bg: #f4f7f6;
            --white: #ffffff;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        #app {
            background: var(--white);
            padding: 2rem;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            max-width: 500px;
            width: 100%;
            text-align: center;
        }
        h1 { color: var(--primary); font-size: 1.5rem; margin-bottom: 1.5rem; }
        .question { font-size: 1.2rem; margin-bottom: 2rem; color: #333; line-height: 1.4; }
        .options { display: flex; flex-direction: column; gap: 10px; }
        button {
            padding: 12px 20px;
            border: 2px solid var(--accent);
            background: none;
            color: var(--accent);
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: bold;
            transition: all 0.2s;
        }
        button:hover {
            background: var(--accent);
            color: white;
        }
        .result-box {
            background: #e8f4fd;
            padding: 20px;
            border-radius: 10px;
            border-right: 5px solid var(--accent);
        }
        .result-category {
            font-size: 1.8rem;
            color: var(--primary);
            display: block;
            margin-top: 10px;
        }
        .keywords {
            font-size: 0.9rem;
            color: #666;
            margin-top: 10px;
            font-style: italic;
        }
        .restart {
            margin-top: 20px;
            color: #888;
            text-decoration: underline;
            cursor: pointer;
            font-size: 0.9rem;
        }
    </style>
</head>

<div id="app">

</div>
