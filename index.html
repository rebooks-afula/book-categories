<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מאתר קטגוריות - סיפור חוזר</title>
    <style>
        :root {
            --primary-green: #2d5a27; /* Dark green from logo */
            --accent-green: #4caf50;  /* Bright green from logo */
            --bg-soft: #f0f4f0;
            --text-main: #2c3e50;
            --white: #ffffff;
            --shadow: 0 12px 30px rgba(0,0,0,0.08);
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-soft);
            background-image: radial-gradient(var(--accent-green) 0.5px, transparent 0.5px);
            background-size: 30px 30px; /* Subtle pattern */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        #app {
            background: var(--white);
            padding: 2.5rem;
            border-radius: 24px;
            box-shadow: var(--shadow);
            max-width: 480px;
            width: 100%;
            text-align: center;
            position: relative;
            border: 1px solid rgba(0,0,0,0.02);
        }

        .header-logo {
            width: 160px;
            margin-bottom: 1.5rem;
        }

        h1 {
            font-size: 1.1rem;
            color: var(--primary-green);
            margin-bottom: 2rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            opacity: 0.8;
        }

        .q {
            font-size: 1.3rem;
            margin-bottom: 2rem;
            font-weight: 700;
            color: var(--text-main);
            line-height: 1.4;
        }

        /* Container for buttons - Structure untouched */
        .btns {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* Button Styling */
        button {
            padding: 16px 20px;
            border: 1.5px solid #edf2ed;
            background: var(--white);
            color: var(--text-main);
            border-radius: 14px;
            cursor: pointer;
            font-weight: 600;
            font-size: 1rem;
            text-align: right;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        button::after {
            content: '←';
            opacity: 0.3;
            font-size: 1.2rem;
        }

        button:hover {
            border-color: var(--accent-green);
            background-color: #f7faf7;
            color: var(--primary-green);
            transform: translateX(-5px);
            box-shadow: 0 4px 12px rgba(45, 90, 39, 0.1);
        }

        /* Result View */
        .res-box {
            background: linear-gradient(135deg, #e8f5e9 0%, #c8e6c9 100%);
            padding: 35px 20px;
            border-radius: 18px;
            font-size: 2rem;
            color: var(--primary-green);
            margin-bottom: 20px;
            font-weight: 800;
            border: 1px solid rgba(0,0,0,0.05);
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .tip {
            color: #5d6d7e;
            font-size: 0.9rem;
            background: #fff9c4;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 25px;
            line-height: 1.5;
        }

        /* Navigation Links */
        .nav {
            margin-top: 20px;
            display: flex;
            gap: 25px;
            justify-content: center;
            border-top: 1px solid #eee;
            padding-top: 20px;
        }

        .link {
            color: #95a5a6;
            text-decoration: none;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            transition: color 0.2s;
        }

        .link:hover {
            color: var(--accent-green);
        }

        #err { color: #e74c3c; margin-top: 15px; font-size: 0.85rem; }

        @keyframes popIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }

        /* Loading state */
        #content:empty::before {
            content: 'טוען...';
            color: var(--accent-green);
        }
    </style>
</head>
<body>

<div id="app">
    <img src="https://i.imgur.com/hrOZ5YG.png" alt="Sipur Hozer Logo" class="header-logo">
    
    <div id="content">טוען נתונים...</div>
    <div id="err"></div>
</div>

<script>
    const steps = {
        start: {
            t: "באיזו שפה הספר?",
            o: [{t: "אנגלית", n: "en"}, {t: "עברית / שפה אחרת", n: "aud"}]
        },
        en: {
            t: "מהו סגנון הספר (באנגלית)?",
            o: [
                {t: "Detective, Murder, Thriller, Mystery", n: "r_אנגלית מתח"},
                {t: "Love, Relationship, Romance, Heart", n: "r_אנגלית רומן"},
                {t: "Dragon, Magic, Future, Space, Fantasy", n: "r_אנגלית פנטזיה"},
                {t: "Novel, Story, Classics, Prose", n: "r_אנגלית פרוזה"}
            ]
        },
        aud: {
            t: "מי קהל היעד של הספר?",
            o: [{t: "ילדים או נוער", n: "kids"}, {t: "מבוגרים", n: "adult_type"}]
        },
        kids: {
            t: "מה רמת הקריאה או הגיל?",
            o: [
                {t: "פעוטות, קשיח, דפי קרטון, ציורים", n: "r_ילדים קשיחים"},
                {t: "מנוקד, אותיות גדולות, ראשית קריאה", n: "r_ראשית קריאה"},
                {t: "מעשייה, אגדה, חברות, בעלי חיים", n: "r_ילדים כללי"},
                {t: "תיכון, אהבה ראשונה, ללא ניקוד", n: "r_נוער"}
            ]
        },
        adult_type: {
            t: "האם הספר עלילתי או ספר מידע?",
            o: [{t: "עלילתי (סיפור)", n: "fic_genre"}, {t: "מידע / מחקר / הדרכה", n: "nf"}]
        },
        fic_genre: {
            t: "מהו הז'אנר המרכזי?",
            o: [
                {t: "מתח, פעולה, משטרה, ריגול", n: "r_מתח"},
                {t: "רומן, אהבה, יחסים", n: "r_רומן"},
                {t: "סיפורת כללית, דרמה, פרוזה", n: "r_פרוזה כללית"}
            ]
        },
        nf: {
            t: "באיזה תחום עוסק ספר העיון?",
            o: [
                {t: "היסטוריה, צבא, פוליטיקה", n: "hist"},
                {t: "יהדות, פסיכולוגיה, ביוגרפיה, מדע", n: "soul"},
                {t: "בישול, בריאות, הורות, פנאי", n: "life"}
            ]
        },
        hist: {
            t: "חפשו מילת מפתח בתקציר:",
            o: [
                {t: "ציונות, ארץ ישראל, קום המדינה", n: "r_היסטוריית ישראל"},
                {t: "נאצים, מחנות, הישרדות, מלחמת העולם ה-2", n: "r_שואה"},
                {t: "האימפריה, המהפכה, המאה ה-19, עבר", n: "r_היסטוריה כללית"},
                {t: "צה\"ל, אסטרטגיה, מוסד, שב\"כ", n: "r_צבא ובטחון"},
                {t: "ממשל, דמוקרטיה, מפלגות, פוליטיקה", n: "r_פוליטיקה"}
            ]
        },
        soul: {
            t: "חפשו מילת מפתח בתקציר:",
            o: [
                {t: "הלכה, תלמוד, חז\"ל, מסורת, קבלה", n: "r_יהדות"},
                {t: "טיפול, נפש, רגשות, מחקר, פסיכולוגיה", n: "r_פסיכולוגיה"},
                {t: "הגות, מוסר, פילוסופיה, לוגיקה", n: "r_פילוסופיה"},
                {t: "סיפור חייו, יומן, אוטוביוגרפיה", n: "r_ביוגרפיה"},
                {t: "תגלית, אבולוציה, אקדמיה, חינוך", n: "r_מדע וחינוך"},
                {t: "כסף, שוק ההון, ניהול, כלכלה", n: "r_כלכלה"},
                {t: "ציור, אדריכלות, עיצוב, אמנות", n: "r_אמנות"}
            ]
        },
        life: {
            t: "מהו תחום ההדרכה?",
            o: [
                {t: "אושר, רוחניות, מדיטציה, השראה", n: "r_עידן חדש ועזרה עצמית"},
                {t: "תינוקות, חינוך ילדים, גמילה, הורות", n: "r_הורות"},
                {t: "מתכונים, מטבח, אפייה, תזונה", n: "r_בישול"},
                {t: "רפואה, ויטמינים, כושר, מחלות", n: "r_בריאות"},
                {t: "מסלולים, מפה, חיות, אקולוגיה", n: "r_טבע וטיול"},
                {t: "בדיחות, מצחיק, סאטירה", n: "r_הומור"}
            ]
        }
    };

    let history = [];

    function render(key, isBack = false) {
        try {
            const div = document.getElementById('content');
            
            if (key.startsWith('r_')) {
                const name = key.replace('r_', '');
                div.innerHTML = `
                    <div class="res-box"><strong>${name}</strong></div>
                    <div class="tip">💡 <strong>טיפ:</strong> אם הספר נראה רציני ומחקרי ללא קטגוריה מדויקת, מקומו ב'עיון'.</div>
                    <div class="nav">
                        <span class="link" onclick="goBack()">🔙 חזור</span>
                        <span class="link" onclick="render('start')">🔄 התחלה מחדש</span>
                    </div>
                `;
                return;
            }

            const step = steps[key];
            if (!isBack && key !== 'start') {
                const now = div.getAttribute('data-k');
                if (now) history.push(now);
            }
            if (key === 'start') history = [];
            div.setAttribute('data-k', key);

            let html = `<div class="q">${step.t}</div><div class="btns">`;
            step.o.forEach(btn => {
                html += `<button onclick="render('${btn.n}')">${btn.t}</button>`;
            });
            html += `</div><div class="nav">`;
            if (history.length > 0) html += `<span class="link" onclick="goBack()">🔙 חזור</span>`;
            html += `<span class="link" onclick="render('start')">🏠 התחלה</span></div>`;
            div.innerHTML = html;
        } catch (e) {
            document.getElementById('err').innerText = "שגיאת קוד: " + e.message;
        }
    }

    window.goBack = () => { if (history.length > 0) render(history.pop(), true); };
    window.render = render;
    window.onload = () => render('start');
</script>

</body>
</html>
