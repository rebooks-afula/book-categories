<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מאתר קטגוריות ספרים</title>
    <style>
        :root {
            --primary: #2c3e50;
            --accent: #3498db;
            --bg: #f4f7f6;
            --white: #ffffff;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        #app {
            background: var(--white);
            padding: 2rem;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            max-width: 500px;
            width: 100%;
            text-align: center;
        }
        h1 { color: var(--primary); font-size: 1.5rem; margin-bottom: 1.5rem; }
        .question { font-size: 1.2rem; margin-bottom: 2rem; color: #333; line-height: 1.4; }
        .options { display: flex; flex-direction: column; gap: 10px; }
        button {
            padding: 12px 20px;
            border: 2px solid var(--accent);
            background: none;
            color: var(--accent);
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: bold;
            transition: all 0.2s;
        }
        button:hover {
            background: var(--accent);
            color: white;
        }
        .result-box {
            background: #e8f4fd;
            padding: 20px;
            border-radius: 10px;
            border-right: 5px solid var(--accent);
        }
        .result-category {
            font-size: 1.8rem;
            color: var(--primary);
            display: block;
            margin-top: 10px;
        }
        .keywords {
            font-size: 0.9rem;
            color: #666;
            margin-top: 10px;
            font-style: italic;
        }
        .restart {
            margin-top: 20px;
            color: #888;
            text-decoration: underline;
            cursor: pointer;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

<div id="app">
    <div id="content">
        </div>
</div>

<script>
    const steps = {
        start: {
            text: "באיזו שפה הספר?",
            options: [
                { text: "אנגלית", next: "english" },
                { text: "עברית / שפה אחרת", next: "audience" }
            ]
        },
        english: {
            text: "מהו סגנון הספר (באנגלית)?",
            options: [
                { text: "Detective, Murder, Thriller, Police, Secret, Mystery", next: "res_אנגלית מתח" },
                { text: "Love, Relationship, Heart, Marriage, Forever", next: "res_אנגלית רומן" },
                { text: "Dragon, Magic, Kingdom, Future, Space", next: "res_אנגלית פנטזיה" },
                { text: "Novel, Story, Classics", next: "res_אנגלית פרוזה" }
            ]
        },
        audience: {
            text: "מי קהל היעד של הספר?",
            options: [
                { text: "ילדים או נוער", next: "kids_youth" },
                { text: "מבוגרים", next: "adult_type" }
            ]
        },
        kids_youth: {
            text: "מה רמת הקריאה או הגיל?",
            options: [
                { text: "פעוטות, קשיח, דפי קרטון, ציורים", next: "res_ילדים ספרים גדולים/קשיחים" },
                { text: "מנוקד, אותיות גדולות, שלב 1, קוראים בעצמם", next: "res_ראשית קריאה" },
                { text: "מעשייה, אגדה, חברות, בעלי חיים", next: "res_ילדים כללי" },
                { text: "תיכון, אהבה ראשונה, הרפתקאות, ללא ניקוד", next: "res_נוער" }
            ]
        },
        adult_type: {
            text: "האם הספר עלילתי או ספר מידע?",
            options: [
                { text: "עלילתי", next: "fiction_genre" },
                { text: "מידע / מחקר", next: "non_fiction_genre" }
            ]
        },
        fiction_genre: {
            text: "מהו הז'אנר המרכזי? (בדוק קודם אם יש לוגו 'עם עובד')",
            options: [
                { text: "ספר שנותן מידע", next: "history_genre" },
                { text: "ספר מחקרי", next: "soul_genre" },
                { text: "ספר הדרכה", next: "lifestyle_genre" }
            ]
        },
        history_genre: {
            text: "חפשו את מילת המפתח המתאימה בתקציר",
            options: [
                { text: "ציונות, ארץ ישראל, התיישבות, קום המדינה, מחתרות", next: "res_היסטוריית ישראל" },
                { text: "נאצים, מחנות, הישרדות, גטו, עדות, מלחמת העולם ה-2", next: "res_שואה" },
                { text: "האימפריה, המהפכה, המאה ה-19, עבר", next: "res_היסטוריה כללית" },
                { text: "צה"ל, אסטרטגיה, קרב, מוסד, שב"כ, חיל", next "res_צבא ובטחון" },
                { text: "ממשל, דמוקרטיה, מפלגות, שלטון, יחסים בינלאומיים", "res_פוליטיקה" }   
            ]
        },
        soul_genre: {
            options: [
                { text: "חפשו את מילת המפתח המתאימה בתקציר" },
                { text: "הלכה, תלמוד, חז"ל, מסורת, תפילה, פרשת השבוע, קבלה", "res_יהדות" },
                { text: "טיפול, נפש, רגשות, מחקר, התנהגות, פרויד", "res_פסיכולוגיה" },
                { text: "הגות, מוסר, קיום, שאלות, לוגיקה", "res_פילוסופיה" },
                { text: "סיפור חייו של, זה סיפור חיי, יומן, אוטוביוגרפיה", "res_ביוגרפיה" },
                { text: "תגלית, אבולוציה, הוראה, למידה, אקדמיה", "res_מדע וחינוך" },
                { text: "כסף, שוק ההון, ניהול, עסקים, השקעות, אינפלציה", "res_כלכלה" },
                { text: "ציור, מוזיאון, אדריכלות, עיצוב, קולנוע", "res_אמנות" }
        ]
    },    

        lifestyle_genre: {
            options: [
                { text: "אושר, הצלחה, רוחניות, מדיטציה, שינוי, השראה", next: "res_עידן חדש ועזרה עצמית" },
                { text: "תינוקות, חינוך ילדים, גמילה, גיל ההתבגרות", next: "res_הורות" },
                { text: "מתכונים, מטבח, אפייה, שף, תזונה", next: "res_בישול" },
                { text: "רפואה, ויטמינים, כושר, מחלות, אריכות ימים", next "res_בריאות" },
                { text: "מסלולים, מפה, חיות, סביבה, אקולוגיה", next "res_טבע וטיול" },
                { text: "בדיחות, מצחיק, סאטירה", next "res_הומור" }
            ]
        },
        non_fiction_genre: {
            text: "מהו נושא העיון?",
            options: [
                { text: "ציונות, ארץ ישראל, התיישבות, קום המדינה, מחתרות", next: "res_היסטוריית ישראל" },
                { text: "נאצים, מחנות, הישרדות, גטו, עדות, מלחמת העולם ה-2", next: "res_שואה" },
                { text: "יהדות / הלכה / קבלה", next: "res_יהדות" },
                { text: "האימפריה, המהפכה, המאה ה-19, עבר.", next: "res_עידן חדש" },
                { text: "מתכונים ואוכל", next: "res_בישול" },
                { text: "ביוגרפיה (סיפור חיים)", next: "res_ביוגרפיה" },
                { text: "אחר (רפואה, טבע, הומור)", next: "res_עיון כללי" }
            ]
        }
    };

    function render(stepKey) {
        const container = document.getElementById('content');
        
        if (stepKey.startsWith('res_')) {
            const category = stepKey.replace('res_', '');
            container.innerHTML = `
                <div class="result-box">
                    <span>הקטגוריה שנמצאה:</span>
                    <strong class="result-category">${category}</strong>
                    <p class="keywords">זכור: אם הספר נראה רציני ומחקרי ללא קטגוריה מדויקת, מקומו ב'עיון'.</p>
                </div>
                <div class="restart" onclick="render('start')">התחל מחדש</div>
            `;
            return;
        }

        const step = steps[stepKey];
        let html = `<h1>איתור קטגוריית ספר</h1>`;
        html += `<div class="question">${step.text}</div>`;
        html += `<div class="options">`;
        step.options.forEach(opt => {
            html += `<button onclick="render('${opt.next}')">${opt.text}</button>`;
        });
        html += `</div>`;
        html += `<div class="restart" onclick="render('start')">חזור להתחלה</div>`;
        
        container.innerHTML = html;
    }

    // הפעלה ראשונית
    render('start');
</script>

</body>

</html>
